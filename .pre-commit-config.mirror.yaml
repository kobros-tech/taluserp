exclude: |
  (?x)
  /migrations/
  /(^|/)vendor/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: debug-statements
      - id: fix-byte-order-marker

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black"]

  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ["--max-line-length=100", "--extend-ignore=E203"]

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.0
    hooks:
      - id: pyupgrade
        args: ["--py3-plus"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, yaml, json, markdown, xml]
        additional_dependencies:
          - "prettier@3.1.0"
          - "@prettier/plugin-xml@3.2.2"

  - repo: local
    hooks:
      - id: oca-license-header
        name: oca-license-header
        entry: python3 -m oca_hooks.oca_license_header
        language: system
        types: [python]

      - id: manifest-required-keys
        name: manifest-required-keys
        entry: python3 -m oca_hooks.manifest_required_keys
        language: system
        files: /__manifest__\.py$

      - id: manifest-version-format
        name: manifest-version-format
        entry: python3 -m oca_hooks.manifest_version_format
        language: system
        files: /__manifest__\.py$

      - id: odoo-module-noupdate
        name: odoo-module-noupdate
        entry: python3 -m oca_hooks.odoo_module_noupdate
        language: system
        files: /\.xml$
