[metadata]
name = stock_picking_prevent_consolidation
version = 18.0.1.0.0
description = Prevent stock move consolidation per operation type
author = KOBROS-TECH LTD
author-email = support@kobros-tech.com
url = https://github.com/kobros-tech/taluserp
license = AGPL-3
classifiers =
    Environment :: Web Environment
    Framework :: Odoo
    Framework :: Odoo :: 18.0
    License :: OSI Approved :: GNU Affero General Public License v3
    Operating System :: OS Independent
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Private :: Do Not Upload

[options]
packages = find:
python_requires = >=3.10

[options.packages.find]
include = stock_picking_prevent_consolidation

[flake8]
include_dirs = .
max-line-length = 100
extend-ignore = E203, W503
exclude = .git,__pycache__,.venv,venv,migrations,vendor

[isort]
profile = black
line_length = 100
multi_line_mode = 3

[egg_info]
tag_build =
tag_date = 0
